<head>

  <style>
    :root {
      --bg: #05060a;
      --panel: rgba(12, 15, 22, 0.72);
      --line: rgba(120, 170, 255, 0.22);
      --ps-blue: #2e7df7;
      --ps-cyan: #56c8ff;
      --ink: #e8eefc;
      --muted: #8b9bb8;
      --ok: #45d483;
      --warn: #f0c040;
      --err: #ff5d6c;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #101a2e 0%, #070a12 45%, #04050a 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 0;
    }

    #controller {
      width: min(120vw, 160vh);
      height: auto;
      transform: scale(2.35);
      transform-origin: 50% 45%;
      filter: drop-shadow(0 40px 70px rgba(0, 0, 0, 0.65));
      animation: drift 14s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: scale(2.35) translate3d(-1.5%, 0.8%, 0) rotate(-0.6deg); }
      to   { transform: scale(2.42) translate3d(1.5%, -1.2%, 0) rotate(0.8deg); }
    }

    #stage::after {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(circle at 62% 30%, rgba(86, 200, 255, 0.16), transparent 42%),
                  radial-gradient(circle at 28% 72%, rgba(46, 125, 247, 0.12), transparent 40%);
      pointer-events: none;
      z-index: 1;
    }

    #status-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 620px);
      padding: 26px 30px 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      z-index: 10;
      text-align: center;
    }

    #status-eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #exploit-status {
      font-size: clamp(20px, 3.4vw, 30px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--ink);
      min-height: 1.2em;
      transition: color 0.25s ease;
    }

    #exploit-status.is-running { color: var(--ps-cyan); }
    #exploit-status.is-ok      { color: var(--ok); }
    #exploit-status.is-warn    { color: var(--warn); }
    #exploit-status.is-err     { color: var(--err); }

    #exploit-detail {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      min-height: 1.2em;
      word-break: break-word;
    }

    #progress-rail {
      margin-top: 20px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ps-blue), var(--ps-cyan));
      box-shadow: 0 0 18px rgba(86, 200, 255, 0.65);
      transition: width 0.5s ease;
    }

    #build-stamp {
      margin-top: 14px;
      font: 11px/1.4 "Consolas", "DejaVu Sans Mono", monospace;
      color: var(--muted);
      opacity: 0.8;
    }

    #console {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 30vh;
      padding: 14px 20px 18px;
      overflow-y: auto;
      font: 12px/1.55 "Consolas", "DejaVu Sans Mono", monospace;
      color: #9fb3d1;
      background: linear-gradient(to top, rgba(4, 6, 12, 0.94), rgba(4, 6, 12, 0.55));
      border-top: 1px solid var(--line);
      z-index: 20;
      scrollbar-width: thin;
      scrollbar-color: rgba(86, 200, 255, 0.35) transparent;
    }

    #console .log-line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    #console .log-line:last-child {
      color: var(--ink);
    }

    #console-toggle {
      position: fixed;
      bottom: calc(30vh + 12px);
      right: 16px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      cursor: pointer;
      z-index: 25;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    body.log-hidden #console { display: none; }
    body.log-hidden #console-toggle { bottom: 16px; }

    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .toast {
      box-sizing: border-box;
      background: #0b0f18;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 10px 16px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      max-width: 320px;
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .toast.show { opacity: 1; transform: translateX(0); }
    .toast.hide { opacity: 0; transform: translateX(100%); }

    #crashlog-banner {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      border-radius: 16px !important;
    }
  </style>
</head>
